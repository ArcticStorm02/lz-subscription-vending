name: Repo Bootstrap - Terraform Release
run-name: "Repo Bootstrap - Terraform Release"

on:
  workflow_dispatch: {}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: Repo-Bootstrap-Build

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

      TF_VAR_github_app_id: ${{ vars.TF_VAR_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_VAR_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.TF_VAR_GITHUB_APP_PRIVATE_KEY }}

    defaults:
      run:
        working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Terraform Version
        run: terraform --version

      - name: Terraform Init
        run: terraform init -backend-config="../../init/02-Repo-Bootstrap/repo-bootstrap.ini" -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan -var-file='../../tfvars/02-Repo-Bootstrap/repo-bootstrap.tfvars'

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: repo-bootstrap-tfplan
          path: ./infra/environments/prod/modules-main/02-Repo-Bootstrap/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: Repo-Bootstrap-Release

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

      TF_VAR_github_app_id: ${{ vars.TF_VAR_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_VAR_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.TF_VAR_GITHUB_APP_PRIVATE_KEY }}

    defaults:
      run:
        working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: repo-bootstrap-tfplan
          path: ./infra/environments/prod/modules-main/02-Repo-Bootstrap

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Terraform Version
        run: terraform --version

      - name: Terraform Init
        run: terraform init -backend-config="../../init/02-Repo-Bootstrap/repo-bootstrap.ini" -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan