name: Subscription Vending - Terraform Build
run-name: "Subscription Vending - Terraform Build"

on:
  push:
    branches:
      - main
      - develop
      - feature-*
    paths:
      - "infra/environments/prod/modules-main/01-Subscription-Vending/**"
      - "infra/environments/prod/modules-child/01-Subscription-Vending/**"
      - "infra/environments/prod/init/01-Subscription-Vending/**"      
      - "infra/environments/prod/tfvars/01-Subscription-Vending/**"
      - ".github/workflows/build-subscription-vending.yml"

  workflow_dispatch: {}
  
jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: Repo-Bootstrap-Build

    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

    # defaults:
    #   run:
    #     working-directory: ./infra/environments/prod/modules-main/01-Subscription-Vending


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Terraform Version
        working-directory: ./infra/environments/prod/modules-main/01-Subscription-Vending
        run: terraform --version

      - name: Terraform Init
        working-directory: ./infra/environments/prod/modules-main/01-Subscription-Vending
        run: terraform init -backend-config="../../init/01-Subscription-Vending/subscription-vending.ini" -input=false

      - name: Terraform Validate
        working-directory: ./infra/environments/prod/modules-main/01-Subscription-Vending
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/environments/prod/modules-main/01-Subscription-Vending
        run: terraform plan -input=false -out=tfplan -var-file='../../tfvars/01-Subscription-Vending/subscription-vending.tfvars'
      
