name: Repo Bootstrap - Terraform Build
run-name: "Repo Bootstrap - Terraform Build"

on:
  push:
    branches:
      - main
      - develop
      - feature-*
    paths:
      - "infra/environments/prod/modules-main/02-Repo-Bootstrap/**"
      - "infra/environments/prod/modules-child/02-Repo-Bootstrap/**"
      - "infra/environments/prod/init/02-Repo-Bootstrap/**"      
      - "infra/environments/prod/tfvars/02-Repo-Bootstrap/**"
      - ".github/workflows/build-repo-bootstrap.yml"

  workflow_dispatch: {}
  
jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: Repo-Bootstrap-Build

    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

      TF_VAR_GITHUB_APP_ID: ${{ vars.TF_VAR_GITHUB_APP_ID }}
      TF_VAR_GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_VAR_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TF_VAR_GITHUB_APP_PRIVATE_KEY }}

    # defaults:
    #   run:
    #     working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Terraform Version
        working-directory: ./infra/environments/prod/modules-main/02-Repo
        run: terraform --version

      - name: Terraform Init
        working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap
        run: terraform init -backend-config="../../init/02-Repo-Bootstrap/repo-bootstrap.ini" -input=false

      - name: Terraform Validate
        working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/environments/prod/modules-main/02-Repo-Bootstrap
        run: terraform plan -input=false -out=tfplan -var-file='../../tfvars/02-Repo-Bootstrap/repo-bootstrap.tfvars'
      
